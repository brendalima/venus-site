<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />

    <!-- Lê o tema escolhido antes da primeira pintura. O React só monta
         depois do CSS, e quem escolheu o claro veria um lampejo escuro a
         cada carregamento — o mesmo cuidado que mantém a tipografia sem
         webfont. O escuro é o padrão, então é a ausência do atributo, e
         só o claro precisa ser escrito. A chave está também em
         src/lib/tema.ts. -->
    <script>
      try {
        if (localStorage.getItem("venus-tema") === "claro") {
          document.documentElement.dataset.tema = "claro";
        }
      } catch (e) {
        /* Armazenamento bloqueado. Segue no escuro, que é o padrão. */
      }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <title>Vênus Oasis — Moda praia</title>
    <meta
      name="description"
      content="Catálogo Vênus Oasis: moda praia autoral, produzida em pequenos lotes no Brasil."
    />
    <link rel="canonical" href="https://venusoasis.com.br/" />

    <!-- Preview de link no WhatsApp e Instagram. og:image precisa ser URL
         absoluta — caminho relativo é ignorado pelos rastreadores. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://venusoasis.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vênus Oasis" />
    <meta property="og:url" content="https://venusoasis.com.br/" />
    <meta property="og:site_name" content="Vênus Oasis" />
    <meta property="og:title" content="Vênus Oasis — Moda praia" />
    <meta
      property="og:description"
      content="Moda praia autoral, produzida em pequenos lotes no Brasil."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
